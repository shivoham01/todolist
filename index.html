<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Todo List App</title>
    <style>
        :root {
            --bg: #0f1724;
            --card: #0b1220;
            --muted: #94a3b8;
            --accent: #60a5fa;
            --accent-2: #7c3aed;
            --glass: rgba(255, 255, 255, 0.03);
            --radius: 14px;
            --maxw: 720px;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: radial-gradient(1200px 600px at 10% 10%, rgba(96, 165, 250, 0.06), transparent),
                radial-gradient(900px 500px at 95% 90%, rgba(124, 58, 237, 0.05), transparent),
                var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e6eef8;
        }

        .todo-app {
            width: 100%;
            max-width: var(--maxw);
            background: linear-gradient(180deg, var(--card), rgba(7, 13, 25, 0.9));
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: 0 10px 30px rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        header {
            display: flex;
            align-items: center;
            gap: 16px
        }

        .logo {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 20px
        }

        h1 {
            font-size: 20px;
            margin: 0
        }

        p.lead {
            margin: 0;
            color: var(--muted);
            font-size: 13px
        }

        .add {
            display: flex;
            gap: 10px;
            margin-top: 18px
        }

        .add input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: var(--glass);
            color: inherit;
            outline: none;
            font-size: 14px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }

        .add button {
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border: 0;
            color: #021028;
            padding: 0 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer
        }

        .add button:active {
            transform: translateY(1px)
        }

        /* Filters (radio) */
        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 18px 0
        }

        .controls input {
            display: none
        }

        .controls label {
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font-size: 13px
        }

        .controls input:checked+label {
            background: rgba(255, 255, 255, 0.04);
            color: var(--accent)
        }

        .tasks {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 8px
        }

        .task {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.01), transparent);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .task input[type=checkbox] {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: transparent;
            display: inline-grid;
            place-items: center;
            cursor: pointer
        }

        .task input[type=checkbox]:checked {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border: 0
        }

        .task input[type=checkbox]:checked::after {
            content: '✓';
            color: #001223;
            font-size: 12px;
            font-weight: 700
        }

        .task label {
            flex: 1;
            word-break: break-word
        }

        .task small {
            display: block;
            color: var(--muted);
            font-size: 12px
        }

        /* Completed look */
        .task:has(input[type=checkbox]:checked) label {
            color: var(--muted);
            text-decoration: line-through
        }

        .task .meta {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .remove {
            background: transparent;
            border: 0;
            color: var(--muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px
        }

        .remove:hover {
            background: rgba(255, 255, 255, 0.02);
            color: #ffb4b4
        }

        footer {
            margin-top: 16px;
            color: var(--muted);
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        /* CSS-only filters using :has() — requires modern browser */
        #filter-all:checked~.tasks .task {
            display: flex
        }

        #filter-active:checked~.tasks .task:has(input[type=checkbox]:checked) {
            display: none
        }

        #filter-active:checked~.tasks .task:not(:has(input[type=checkbox]:checked)) {
            display: flex
        }

        #filter-completed:checked~.tasks .task:not(:has(input[type=checkbox]:checked)) {
            display: none
        }

        #filter-completed:checked~.tasks .task:has(input[type=checkbox]:checked) {
            display: flex
        }

        /* Responsive */
        @media (max-width:520px) {
            .todo-app {
                padding: 18px
            }

            .logo {
                width: 48px;
                height: 48px
            }
        }
    </style>
</head>

<body>
    <main class="todo-app" role="application" aria-label="Todo list">
        <header>
            <div class="logo">TL</div>
            <div>
                <h1>Todo List</h1>
                <p class="lead">A simple, ToDo list app.</p>
            </div>
        </header>

        <form class="add">
            <input type="text" id="inpTodo" placeholder="Add a todo..." aria-label="New todo" />
            <button type="button" onclick="addTodo()" aria-disabled="true">Add</button>
        </form>

        <section class="list">
            <div class="controls" role="tablist">
                <input type="radio" onclick="getTodos()" name="filter" id="filter-all" checked>
                <label for="filter-all">All</label>

                <input type="radio" onclick="activeTodos()" name="filter" id="filter-active">
                <label for="filter-active">Active</label>

                <input type="radio" onclick="completedTodos()" name="filter" id="filter-completed">
                <label for="filter-completed">Completed</label>
            </div>

            <ul class="tasks">
            </ul>

            <footer>
                <div><a href="https://ashutosh.pro/" target="_blank">Ashutosh.pro</a></div>
                <div style="color:var(--muted);font-size:12px">HTML, CSS & JAVASCRIPT</div>
            </footer>
        </section>
    </main>

    <!-- JS -->
    <script>
        // Update Display
        const updateDisplay = () => {
            let tasks = document.querySelector(".tasks");
            tasks.innerHTML = "";
        }

        // Get Todos
        const getTodos = () => {
            updateDisplay();
            let tasks = document.querySelector(".tasks");
            if (!localStorage.getItem("todos")) {
                tasks.innerHTML = "No tasks available..."
            }
            let todos = localStorage.getItem("todos");
            let todolist = JSON.parse(todos);
            todolist.length === 0 ? tasks.innerHTML = "No tasks available..." : "";
            todolist.map((todo) => {
                tasks.innerHTML += `
                <li class="task">
                    <input type="checkbox" ${todo.isCompleted ? "checked" : ""} onclick="status(${todo.id})" id="${todo.id}">
                    <label for="${todo.id}">${todo.todo}</label>
                    <div class="meta"><button class="remove" onclick="removeTodo(${todo.id})" title="Remove">✕</button></div>
                </li>
                `
            });
        }
        getTodos();

        // Completed todos
        const completedTodos = () => {
            let tasks = document.querySelector(".tasks");
            updateDisplay();
            let todos = JSON.parse(localStorage.getItem("todos"));
            todos.map((todo) => {
                todo.isCompleted === true ? tasks.innerHTML += `
                <li class="task">
                    <input type="checkbox" ${todo.isCompleted ? "checked" : ""} onclick="status(${todo.id})" id="${todo.id}">
                    <label for="${todo.id}">${todo.todo}</label>
                    <div class="meta"><button class="remove" onclick="removeTodo(${todo.id})" title="Remove">✕</button></div>
                </li>`: "";
            })
        }

        // Active todos
        const activeTodos = () => {
            let tasks = document.querySelector(".tasks");
            updateDisplay();
            let todos = JSON.parse(localStorage.getItem("todos"));
            todos.map((todo) => {
                todo.isCompleted === false ? tasks.innerHTML += `
                <li class="task">
                    <input type="checkbox" ${todo.isCompleted ? "checked" : ""} onclick="status(${todo.id})" id="${todo.id}">
                    <label for="${todo.id}">${todo.todo}</label>
                    <div class="meta"><button class="remove" onclick="removeTodo(${todo.id})" title="Remove">✕</button></div>
                </li>`: ""
            })
        }

        // Remove Todo
        const removeTodo = (todoId) => {
            let todos = localStorage.getItem("todos");
            let todolist = JSON.parse(todos);
            let filTodos = todolist.filter((todo) => todo.id !== todoId);
            updateDisplay();
            localStorage.setItem("todos", JSON.stringify(filTodos));
            getTodos();
        }

        // Add Todo
        let now = new Date();
        const addTodo = () => {
            let input = document.getElementById("inpTodo");
            let newTodo = {
                id: Date.now(),
                todo: input.value,
                isCompleted: false
            }

            if (!localStorage.getItem("todos")) {
                localStorage.setItem("todos", "[]");
            }
            let todos = localStorage.getItem("todos");
            let todolist = JSON.parse(todos);
            todolist.push(newTodo);
            input.value = "";
            localStorage.setItem("todos", JSON.stringify(todolist));
            updateDisplay();
            getTodos();
        }

        // Status
        const status = (todoId) => {
            const todos = JSON.parse(localStorage.getItem("todos"));
            todos.filter((todo) => {
                if (todo.id === todoId) {
                    todo.isCompleted = !todo.isCompleted;
                    localStorage.setItem("todos", JSON.stringify(todos));
                }
            });
        }

    </script>

</body>

</html>
