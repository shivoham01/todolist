<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Todo List App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="todo-app" role="application" aria-label="Todo list">
        <header>
            <div class="logo">TL</div>
            <div>
                <h1>Todo List</h1>
                <p class="lead">A Simple, TODO List App.</p>
            </div>
        </header>

        <form class="add" id="input-form">
            <input type="text" id="inpTodo" placeholder="Add a todo..." aria-label="New todo" />
            <button type="submit" onclick="addTodo()" aria-disabled="true">Add</button>
        </form>

        <section class="list">
            <div class="controls" role="tablist">
                <input type="radio" onclick="getTodos()" name="filter" id="filter-all" checked>
                <label for="filter-all">All</label>

                <input type="radio" onclick="activeTodos()" name="filter" id="filter-active">
                <label for="filter-active">Active</label>

                <input type="radio" onclick="completedTodos()" name="filter" id="filter-completed">
                <label for="filter-completed">Completed</label>
            </div>

            <ul class="tasks">
            </ul>

            <footer>
                <div><a href="https://ashutosh.pro/" target="_blank">Ashutosh.pro</a></div>
                <div style="color:var(--muted);font-size:12px">HTML, CSS & JAVASCRIPT</div>
            </footer>
        </section>
    </main>

    <script src="index.js"></script>
</body>


</html>
