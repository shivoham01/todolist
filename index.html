<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Todo List App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="todo-app" role="application" aria-label="Todo list">
        <header>
            <div class="logo">TL</div>
            <div>
                <h1>Todo List</h1>
                <p class="lead">A simple, ToDo list app.</p>
            </div>
        </header>

        <form class="add" id="input-form">
            <input type="text" id="inpTodo" placeholder="Add a todo..." aria-label="New todo" />
            <button type="submit" id="addTodo" aria-disabled="true">Add</button>
        </form>

        <section class="list">
            <div class="controls" role="tablist">
                <span id="filter-all">All</span>
                <span id="filter-active">Active</span>
                <span id="filter-complete" for="filter-completed">Completed</span>
            </div>
            <ul class="tasks">
            </ul>

            <footer>
                <div><a href="https://ashutosh.pro/" target="_blank">Ashutosh.pro</a></div>
                <div style="color:var(--muted);font-size:12px">HTML, CSS & JAVASCRIPT</div>
            </footer>
        </section>
    </main>

    <script src="index.js"></script>
</body>

</html>
